# Build, push, deploy — on every push to main.
#
# This replaces CodePipeline, which cannot read from GitHub in ap-southeast-3.
# Authentication is OIDC: no AWS access key is stored anywhere in GitHub. The
# role's trust policy names this repository and this branch, so a workflow
# running anywhere else — a fork, a feature branch — is refused by AWS before
# it can touch a thing.
#
# Set one repository variable: AWS_DEPLOY_ROLE_ARN, from the platform's
# `github_deploy_role_arn` output.

name: Deploy

# Runs after CI, not alongside it. A push to main used to trigger both
# workflows at once, so a red test run still rolled to production; now the
# deploy starts only when CI has finished green on that commit. A manual
# dispatch skips the gate deliberately — for a rollback or a redeploy of a
# commit CI has already passed.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # Needed to mint the OIDC token AWS will trust.
  contents: read

concurrency:
  # Two pushes in quick succession must not race each other into ECS; the
  # later one waits, and the service always ends up on the newest commit.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-3
  ECS_CLUSTER: karlo-prod
  SERVICE_NAME: business-service
  CONTAINER_NAME: business-service
  ECR_REPOSITORY: karlo/business-service
  # The task definition family Terraform registered. Not derivable from the
  # service name — the families are abbreviated — so it is stated.
  TASK_FAMILY: karlo-prod-business

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # On a workflow_run the checkout must name the commit CI tested; the
      # default would be whatever main points at by the time this starts.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Tagged by commit, never "latest": a tag must always mean the same
      # image, or a rollback cannot name what to roll back to. The repository
      # is IMMUTABLE for the same reason.
      - name: Build and push
        id: build
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:sha-${DEPLOY_SHA::12}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      # The task definition is owned by Terraform, which ignores changes to its
      # container definitions precisely so this step can swap the image without
      # the next terraform apply rolling it back.
      - name: Fetch the current task definition
        run: |
          aws ecs describe-task-definition --task-definition "$TASK_FAMILY" \
            --query taskDefinition > task-def.json

      - uses: aws-actions/amazon-ecs-render-task-definition@v1
        id: render
        with:
          task-definition: task-def.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build.outputs.image }}

      # Register first, so the migration runs the image just built — the
      # one whose migrations match its code. The deploy action would register
      # and roll in one step, which is the wrong order here.
      - name: Register the task definition
        id: register
        run: |
          ARN=$(aws ecs register-task-definition \
                --cli-input-json file://${{ steps.render.outputs.task-definition }} \
                --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"
          echo "registered $ARN"

      # Migrate BEFORE rolling the service, as a one-off task inside the VPC
      # with the service's own secrets — the only place RDS is reachable from.
      # On a fresh environment it also creates the database. A failed
      # migration stops the deploy here, so the running service never sees a
      # schema its code was not built for.
      #
      # The override is ["migrate"], not ["server","migrate"]: the image's
      # ENTRYPOINT is already the binary, and ECS appends the override to it.
      # With the binary named twice, os.Args[1] was "server" and the
      # migration branch was never taken — the task just started the service
      # against a database that did not exist yet.
      - name: Run migrations
        run: |
          NET=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$SERVICE_NAME" \
                --query 'services[0].networkConfiguration.awsvpcConfiguration' --output json)
          TASK=$(aws ecs run-task --cluster "$ECS_CLUSTER" --launch-type FARGATE \
                --task-definition "${{ steps.register.outputs.arn }}" \
                --network-configuration "{\"awsvpcConfiguration\":$NET}" \
                --overrides "{\"containerOverrides\":[{\"name\":\"$CONTAINER_NAME\",\"command\":[\"migrate\"]}]}" \
                --query 'tasks[0].taskArn' --output text)
          echo "migration task: $TASK"
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK"
          CODE=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK" \
                --query 'tasks[0].containers[0].exitCode' --output text)
          REASON=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK" \
                --query 'tasks[0].stoppedReason' --output text)
          echo "exit code: $CODE  ($REASON)"
          [ "$CODE" = "0" ]

      - name: Roll the service and wait for stability
        run: |
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$SERVICE_NAME" \
                --task-definition "${{ steps.register.outputs.arn }}" --query 'service.serviceName' --output text
          # Fails the job if the new tasks never become healthy, which is what
          # makes a bad deploy visible on the commit rather than in a dashboard.
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$SERVICE_NAME"
