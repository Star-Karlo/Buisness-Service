version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/karlo/business-service/internal/platform/genproto
plugins:
  - local: protoc-gen-go
    out: ../internal/platform/genproto
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: ../internal/platform/genproto
    opt: paths=source_relative
