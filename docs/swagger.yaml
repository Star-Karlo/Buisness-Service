host: localhost:5003
info:
  contact:
    email: engineering@karlo.co.id
    name: Karlo Engineering
  description: 'The transactional core: agreements, orders, the shipment lifecycle
    and invoices.\n\nStatus changes go through state machines rather than accepting
    an arbitrary status string, so an illegal transition is refused with 409 rather
    than written.'
  termsOfService: https://karlo.co.id/terms
  title: Karlo Business API
  version: "1.0"
paths:
