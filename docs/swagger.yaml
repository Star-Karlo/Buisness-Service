        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_karlo_business-service_internal_platform_response.Meta'
      security:
      - BearerAuth: []
      summary: List agreements
      tags:
      - Agreements
    post:
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_karlo_business-service_internal_models.Agreement'
      security:
      - BearerAuth: []
      summary: Create agreement
      tags:
